name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          architecture: 'x64'

      - run: python -m py_compile src/main.py

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: pyinstaller pyinstaller.spec

      - name: Verify build output exists
        run: |
          if (!(Test-Path "dist/BankPDFImporter.exe")) {
            Write-Error "Build output not found!"
            exit 1
          }

      - name: Zip the exe
        run: Compress-Archive -Path dist/BankPDFImporter.exe -DestinationPath dist/BankPDFImporter.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BankPDFImporter.exe
            dist/BankPDFImporter.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}